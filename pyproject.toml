[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "shape-validator"
version = "0.1.0"
description = "A six-test gate for deciding whether a backtested edge is real"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["numpy>=1.24", "pandas>=2.0", "scipy>=1.10"]

[project.urls]
Homepage = "https://github.com/DonMilane/shape-validator"

[tool.setuptools.packages.find]
include = ["shape_validator*"]
